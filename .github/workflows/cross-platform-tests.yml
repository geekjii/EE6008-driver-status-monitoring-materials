name: Cross-platform tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU baseline
        run: python -m pip install -e ".[dev]"
      - name: Compile package
        run: python -m compileall -q src
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Replay synthetic signals without models or camera
        run: python -m driver_monitor.verify --logic-only
      - name: Save synthetic verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-verification-${{ matrix.os }}
          path: outputs/verification/
          if-no-files-found: warn
